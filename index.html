<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="tc" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-48.png" type="image/png" sizes="48x48">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مواقيت الصلاة">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>مواقيت الصلاة</title>
<style>
/* ===== الألوان (أسود ورمادي فقط) ===== */
:root{--bg:#e8e8e8;--card:#fafafa;--text:#161616;--muted:#6a6a6a;--line:#d2d2d2;--accent:#161616;--accent-soft:#d8d8d8;--hero1:#3a3a3a;--hero2:#141414;--hero-text:#fff;--radius:16px;--font:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#000;--text:#f2f2f2;--muted:#8f8f8f;--line:#242424;--accent:#fff;--accent-soft:#1c1c1c;--hero1:#1a1a1a;--hero2:#000}}
:root[data-theme="dark"]{--bg:#000;--card:#000;--text:#f2f2f2;--muted:#8f8f8f;--line:#242424;--accent:#fff;--accent-soft:#1c1c1c;--hero1:#1a1a1a;--hero2:#000}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font);display:flex;justify-content:center;padding:10px}
.wrap{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;gap:8px}
.ico{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hero{background:linear-gradient(145deg,var(--hero1),var(--hero2));color:var(--hero-text);border-radius:22px;padding:12px 16px;text-align:center;position:relative;flex:none}
.top{display:flex;align-items:center;justify-content:space-between;font-size:14px;opacity:.9}
.gear{background:rgba(255,255,255,.14);border:0;color:inherit;border-radius:50%;width:34px;height:34px;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.date{font-size:12px;opacity:.7}
.mid{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:6px}
.mid .big{font-size:clamp(34px,7vh,50px)}
.nn{font-size:clamp(24px,4.6vh,34px);font-weight:800;line-height:1.1;text-align:start}
.nt{font-size:14px;opacity:.85;text-align:start}
.cd{margin-top:8px;display:inline-block;background:rgba(255,255,255,.14);border-radius:12px;padding:4px 16px;font-size:clamp(22px,4.4vh,30px);font-weight:700;letter-spacing:2px;direction:ltr;font-variant-numeric:tabular-nums}
.cd small{display:block;font-size:11px;font-weight:400;letter-spacing:0;opacity:.8;direction:rtl}
.now{font-size:12px;opacity:.7;direction:ltr;margin-top:4px;font-variant-numeric:tabular-nums}
.list{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.row{flex:1;min-height:0;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:0 16px}
.row .ico{font-size:clamp(18px,3.4vh,26px);color:var(--muted)}
.row .n{flex:1;font-size:clamp(15px,2.8vh,19px);font-weight:700}
.row .t{font-size:clamp(16px,3vh,21px);font-weight:500;color:var(--muted);direction:ltr;font-variant-numeric:tabular-nums}
.row.sun .n{font-weight:500;color:var(--muted)}
.row.passed{opacity:.5}
.row.next{background:var(--accent-soft);border-color:var(--accent)}
.row.next .ico,.row.next .t{color:var(--accent)}
.row.next .t{font-weight:800}
.badge{font-size:10px;background:var(--accent);color:var(--bg);border-radius:20px;padding:1px 8px;margin-inline-start:8px;font-weight:700}
.method{flex:none;text-align:center;color:var(--muted);font-size:11px}
.src{flex:none;display:block;text-align:center;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:3px;padding:2px 0 4px}
.src:active{color:var(--text)}
/* لوحة الإعدادات */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
.ov.show{display:flex}
.panel{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;width:100%;max-width:400px;max-height:100%;overflow-y:auto;padding:16px}
.panel h3{margin:0 0 10px;font-size:18px}
.panel label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.panel select{width:100%;font:inherit;font-size:15px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:10px}
.done{width:100%;margin-top:14px;font:inherit;font-weight:700;font-size:15px;padding:10px;border:0;border-radius:12px;background:var(--accent);color:var(--bg);cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="top"><span id="city"></span><button class="gear" id="gear" aria-label="الإعدادات"></button></div>
    <div class="date" id="date"></div>
    <div class="mid"><div class="big" id="bigIco"></div><div><div class="nn" id="nn">--</div><div class="nt" id="nt"></div></div></div>
    <div class="cd"><span id="cd">--:--:--</span><small>متبقي على الأذان</small></div>
    <div class="now" id="now"></div>
  </div>
  <div class="list" id="list"></div>
  <div class="method" id="method"></div>
  <a class="src" id="src" target="_blank" rel="noopener noreferrer">البيانات من: timesprayer.com ↗</a>
</div>

<div class="ov" id="ov"><div class="panel">
  <h3>الإعدادات</h3>
  <label>الدولة</label><select id="sCountry"></select>
  <label>المدينة</label><select id="sCity"></select>
  <label>طريقة حساب الفجر والعشاء</label><select id="sMethod"></select>
  <label>طريقة حساب العصر</label><select id="sAsr"></select>
  <label>المظهر</label><select id="sTheme"><option value="auto">تلقائي</option><option value="light">رمادي فاتح</option><option value="dark">أسود (OLED)</option></select>
  <label class="chk"><input type="checkbox" id="cIcons"> إظهار الأيقونات</label>
  <label class="chk"><input type="checkbox" id="cSec"> إظهار الثواني</label>
  <button class="done" id="done">تم</button>
</div></div>

<script>
/* ===== الإعدادات الافتراضية: عدّل من هنا ===== */
var DEFAULTS={country:"مصر",city:"السويس",method:"egypt",asr:1,theme:"auto",icons:true,seconds:true};

/* المدن: [الاسم, خط العرض, خط الطول, المنطقة الزمنية] */
var CITIES={
"مصر":[["القاهرة",30.0444,31.2357,"Africa/Cairo"],["الإسكندرية",31.2001,29.9187,"Africa/Cairo"],["الجيزة",30.0131,31.2089,"Africa/Cairo"],["السويس",29.9668,32.5498,"Africa/Cairo"],["بورسعيد",31.2653,32.3019,"Africa/Cairo"],["الإسماعيلية",30.5965,32.2715,"Africa/Cairo"],["المنصورة",31.0409,31.3785,"Africa/Cairo"],["طنطا",30.7865,31.0004,"Africa/Cairo"],["الزقازيق",30.5877,31.502,"Africa/Cairo"],["أسيوط",27.1809,31.1837,"Africa/Cairo"],["الأقصر",25.6872,32.6396,"Africa/Cairo"],["أسوان",24.0889,32.8998,"Africa/Cairo"],["الغردقة",27.2579,33.8116,"Africa/Cairo"],["شرم الشيخ",27.9158,34.33,"Africa/Cairo"],["مرسى مطروح",31.3543,27.2373,"Africa/Cairo"]],
"السعودية":[["مكة المكرمة",21.3891,39.8579,"Asia/Riyadh"],["المدينة المنورة",24.5247,39.5692,"Asia/Riyadh"],["الرياض",24.7136,46.6753,"Asia/Riyadh"],["جدة",21.4858,39.1925,"Asia/Riyadh"],["الدمام",26.4207,50.0888,"Asia/Riyadh"]],
"الإمارات":[["دبي",25.2048,55.2708,"Asia/Dubai"],["أبوظبي",24.4539,54.3773,"Asia/Dubai"],["الشارقة",25.3463,55.4209,"Asia/Dubai"]],
"الكويت":[["الكويت",29.3759,47.9774,"Asia/Kuwait"]],
"قطر":[["الدوحة",25.2854,51.531,"Asia/Qatar"]],
"البحرين":[["المنامة",26.2285,50.586,"Asia/Bahrain"]],
"عمان":[["مسقط",23.588,58.3829,"Asia/Muscat"]],
"اليمن":[["صنعاء",15.3694,44.191,"Asia/Aden"],["عدن",12.7855,45.0187,"Asia/Aden"]],
"الأردن":[["عمّان",31.9454,35.9284,"Asia/Amman"]],
"فلسطين":[["القدس",31.7683,35.2137,"Asia/Jerusalem"],["غزة",31.5017,34.4668,"Asia/Gaza"]],
"لبنان":[["بيروت",33.8938,35.5018,"Asia/Beirut"]],
"سوريا":[["دمشق",33.5138,36.2765,"Asia/Damascus"],["حلب",36.2021,37.1343,"Asia/Damascus"]],
"العراق":[["بغداد",33.3152,44.3661,"Asia/Baghdad"],["البصرة",30.5085,47.7804,"Asia/Baghdad"]],
"ليبيا":[["طرابلس",32.8872,13.1913,"Africa/Tripoli"],["بنغازي",32.1167,20.0667,"Africa/Tripoli"]],
"تونس":[["تونس",36.8065,10.1815,"Africa/Tunis"]],
"الجزائر":[["الجزائر",36.7538,3.0588,"Africa/Algiers"]],
"المغرب":[["الرباط",34.0209,-6.8416,"Africa/Casablanca"],["الدار البيضاء",33.5731,-7.5898,"Africa/Casablanca"]],
"السودان":[["الخرطوم",15.5007,32.5599,"Africa/Khartoum"]],
"تركيا":[["إسطنبول",41.0082,28.9784,"Europe/Istanbul"],["أنقرة",39.9334,32.8597,"Europe/Istanbul"]],
"المملكة المتحدة":[["لندن",51.5072,-0.1276,"Europe/London"]],
"أمريكا":[["نيويورك",40.7128,-74.006,"America/New_York"],["لوس أنجلوس",34.0522,-118.2437,"America/Los_Angeles"]]
};
/* طرق الحساب: [الاسم, زاوية الفجر, زاوية العشاء أو دقائق بعد المغرب] */
var METHODS={egypt:["الهيئة المصرية العامة للمساحة",19.5,17.5],mwl:["رابطة العالم الإسلامي",18,17],umm:["أم القرى (مكة)",18.5,90],karachi:["جامعة العلوم الإسلامية - كراتشي",18,18],isna:["أمريكا الشمالية (ISNA)",15,15],kuwait:["الكويت",18,17.5]};
var ASR={1:"العصر: المذهب الشافعي والجمهور (ظل = المثل)",2:"العصر: المذهب الحنفي (ظل = المثلين)"};

/* ===== أيقونات ===== */
function svg(p){return '<svg class="ico" viewBox="0 0 24 24">'+p+'</svg>'}
var ICONS={
fajr:svg('<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/><path d="M3 20h18"/>'),
sunrise:svg('<path d="M12 3v4M5.6 8.6l2.2 2.2M18.4 8.6l-2.2 2.2M2 17h20M7 17a5 5 0 0 1 10 0M8 21h8"/>'),
sun:svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
asr:svg('<circle cx="12" cy="10" r="3.5"/><path d="M12 2v1.5M4.9 5l1 1M19.1 5l-1 1M2 10h1.5M20.5 10H22M3 19h18"/>'),
sunset:svg('<path d="M12 8V4M5.6 9.6l2.2 2.2M18.4 9.6l-2.2 2.2M2 18h20M7 18a5 5 0 0 1 10 0M8 22h8"/><path d="M9 6l3 3 3-3"/>'),
moon:svg('<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/><path d="M17 4v3M15.5 5.5h3"/>'),
gear:svg('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>')
};
var NAMES=[["الفجر","fajr"],["الشروق","sunrise"],["الظهر","sun"],["العصر","asr"],["المغرب","sunset"],["العشاء","moon"]];

/* ===== حساب المواقيت ===== */
var R=Math.PI/180;
function fix(a,b){a=a-b*Math.floor(a/b);return a<0?a+b:a}
function jdate(y,m,d){if(m<=2){y--;m+=12}var A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunPos(j){var D=j-2451545,g=fix(357.529+.98560028*D,360),q=fix(280.459+.98564736*D,360),L=fix(q+1.915*Math.sin(g*R)+.02*Math.sin(2*g*R),360),e=23.439-3.6e-7*D,RA=fix(Math.atan2(Math.cos(e*R)*Math.sin(L*R),Math.cos(L*R))/R/15,24);return{d:Math.asin(Math.sin(e*R)*Math.sin(L*R))/R,eq:q/15-RA}}
function calc(y,m,d,lat,lon,tz,fa,ia,asr){
  var s=sunPos(jdate(y,m,d)+.5-lon/360),eq=s.eq>12?s.eq-24:s.eq,noon=12+tz-lon/15-eq;
  function ang(a,cw){var x=(-Math.sin(a*R)-Math.sin(s.d*R)*Math.sin(lat*R))/(Math.cos(s.d*R)*Math.cos(lat*R));if(x>1||x<-1)return NaN;var t=Math.acos(x)/R/15;return noon+(cw?t:-t)}
  var aa=-Math.atan(1/(asr+Math.tan(Math.abs(lat-s.d)*R)))/R,mag=ang(.833,1);
  var r=[ang(fa,0),ang(.833,0),noon,ang(aa,1),mag,ia>=30?mag+ia/60:ang(ia,1)];
  return r.map(function(h){return isNaN(h)?null:Math.round(fix(h,24)*60)})
}
/* التوقيت المحلي للمدينة */
function zoned(tz){
  var p={},a=new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",second:"numeric"}).formatToParts(new Date());
  a.forEach(function(x){p[x.type]=+x.value});
  var off=(Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-Math.floor(Date.now()/1000)*1000)/36e5;off=Math.round(off*4)/4;
  return{y:p.year,m:p.month,d:p.day,sec:p.hour*3600+p.minute*60+p.second,off:off}
}

/* ===== الحالة والتخزين ===== */
var S={};for(var k in DEFAULTS)S[k]=DEFAULTS[k];
try{var sv=JSON.parse(localStorage.getItem("prayerSettings")||"null");if(sv)for(var k2 in sv)S[k2]=sv[k2]}catch(e){}
if(!sv&&window.matchMedia&&matchMedia("(pointer:coarse) and (max-width:820px)").matches)S.theme="dark";
function save(){try{localStorage.setItem("prayerSettings",JSON.stringify(S))}catch(e){}}
function pad(n){return("0"+n).slice(-2)}
function fmt(mn){return mn===null?"--":((Math.floor(mn/60)%12)||12)+":"+pad(mn%60)+" "+(Math.floor(mn/60)%24<12?"ص":"م")}
function ic(k){return S.icons?ICONS[k]:""}
function curCity(){var l=CITIES[S.country]||CITIES["مصر"];for(var i=0;i<l.length;i++)if(l[i][0]===S.city)return l[i];return l[0]}

var cache={};
function times(z,c){
  var key=[z.y,z.m,z.d,c[0],S.method,S.asr].join();
  if(!cache[key]){var m=METHODS[S.method]||METHODS.egypt;cache={};cache[key]=calc(z.y,z.m,z.d,c[1],c[2],z.off,m[1],m[2],+S.asr)}
  return cache[key]
}
function tick(){
  var c=curCity(),z=zoned(c[3]),T=times(z,c),sec=z.sec,idx=-1,i;
  for(i=0;i<6;i++){if(T[i]!==null&&T[i]*60>sec){idx=i;break}}
  var ni=idx<0?0:idx,tgt=(T[ni]||0)*60+(idx<0?86400:0),df=tgt-sec;
  document.getElementById("nn").textContent=NAMES[ni][0];
  document.getElementById("nt").textContent=fmt(T[ni]);
  document.getElementById("bigIco").innerHTML=ic(NAMES[ni][1]);
  document.getElementById("cd").textContent=pad(Math.floor(df/3600))+":"+pad(Math.floor(df%3600/60))+(S.seconds?":"+pad(df%60):"");
  document.getElementById("now").textContent="الآن "+pad(Math.floor(sec/3600))+":"+pad(Math.floor(sec%3600/60))+(S.seconds?":"+pad(sec%60):"");
  document.getElementById("date").textContent=new Date(Date.UTC(z.y,z.m-1,z.d)).toLocaleDateString("ar-EG",{timeZone:"UTC",weekday:"long",day:"numeric",month:"long",year:"numeric"});
  document.getElementById("city").textContent="🕌 "+c[0]+"، "+S.country;
  var h="";
  for(i=0;i<6;i++){
    var cls="row"+(i===ni?" next":"")+((idx<0||i<idx)&&i!==ni?" passed":"")+(i===1?" sun":"");
    h+='<div class="'+cls+'">'+ic(NAMES[i][1])+'<span class="n">'+NAMES[i][0]+(i===ni?'<span class="badge">التالية</span>':'')+'</span><span class="t">'+fmt(T[i])+'</span></div>';
  }
  document.getElementById("list").innerHTML=h;
  document.getElementById("src").href=S.city==="السويس"?"https://timesprayer.com/prayer-times-in-suez.html":"https://timesprayer.com/";
  document.getElementById("method").textContent=METHODS[S.method][0]+" · "+(+S.asr===1?"العصر شافعي":"العصر حنفي");
}

/* ===== فتح لينك المصدر في المتصفح الأساسي ===== */
(function(){
  var a=document.getElementById("src");
  a.onclick=function(e){
    var app=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone;
    if(app&&/Android/i.test(navigator.userAgent)){
      e.preventDefault();
      var u=new URL(a.href);
      location.href="intent://"+u.host+u.pathname+u.search+"#Intent;scheme=https;action=android.intent.action.VIEW;end";
    }
  };
})();
/* ===== الإعدادات ===== */
function opts(el,arr,sel){el.innerHTML=arr.map(function(a){return '<option value="'+a[0]+'"'+(String(a[0])===String(sel)?" selected":"")+'>'+a[1]+'</option>'}).join("")}
function fillCities(){var l=CITIES[S.country];opts(document.getElementById("sCity"),l.map(function(x){return[x[0],x[0]]}),S.city)}
function applyTheme(){var r=document.documentElement;if(S.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",S.theme);var d=S.theme==="dark"||(S.theme==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);document.getElementById("tc").setAttribute("content",d?"#000000":"#e8e8e8")}
(function(){
  document.getElementById("gear").innerHTML=ICONS.gear;
  opts(document.getElementById("sCountry"),Object.keys(CITIES).map(function(k){return[k,k]}),S.country);
  fillCities();
  opts(document.getElementById("sMethod"),Object.keys(METHODS).map(function(k){return[k,METHODS[k][0]]}),S.method);
  opts(document.getElementById("sAsr"),[[1,"شافعي / جمهور (المثل)"],[2,"حنفي (المثلين)"]],S.asr);
  document.getElementById("sTheme").value=S.theme;
  document.getElementById("cIcons").checked=S.icons;
  document.getElementById("cSec").checked=S.seconds;
  var ov=document.getElementById("ov");
  document.getElementById("gear").onclick=function(){ov.className="ov show"};
  document.getElementById("done").onclick=function(){ov.className="ov"};
  ov.onclick=function(e){if(e.target===ov)ov.className="ov"};
  document.getElementById("sCountry").onchange=function(){S.country=this.value;S.city=CITIES[S.country][0][0];fillCities();save();tick()};
  document.getElementById("sCity").onchange=function(){S.city=this.value;save();tick()};
  document.getElementById("sMethod").onchange=function(){S.method=this.value;save();tick()};
  document.getElementById("sAsr").onchange=function(){S.asr=+this.value;save();tick()};
  document.getElementById("sTheme").onchange=function(){S.theme=this.value;applyTheme();save()};
  document.getElementById("cIcons").onchange=function(){S.icons=this.checked;save();tick()};
  document.getElementById("cSec").onchange=function(){S.seconds=this.checked;save();tick()};
  applyTheme();tick();setInterval(tick,1000);
})();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
